name: Keep Supabase project active

# Free projects need sufficient database activity throughout the week.
# These checks reduce inactivity pauses; only a paid plan guarantees no pauses.
on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      resume_project:
        description: Resume CantAlice if paused, then verify database health
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-health
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The existing deployment credential stays inside GitHub Actions.
      # Resuming is explicitly manual so an intentional pause stays paused.
      - name: Resume paused project and verify database
        if: github.event_name == 'workflow_dispatch' && inputs.resume_project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/resume-supabase.py

      - name: Verify Supabase REST database access
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: bash scripts/check-supabase.sh
